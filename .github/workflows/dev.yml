name: 'Terraform CI'

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.7.0

    - name: Set environment variables
      id: env
      run: |
        # Use GITHUB_REF_NAME for simpler branch matching
        if [ "${{ github.ref_name }}" == "main" ]; then
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=prod" >> $GITHUB_ENV
        elif [ "${{ github.ref_name }}" == "dev" ]; then
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
        else
          # Fallback for PRs or other branches
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
        fi

    - name: Terraform Init
      # Reference context with ${{ env.NAME }}
      run: terraform init
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    - name: Terraform Format
      run: terraform fmt -check
      working-directory: ${{ env.ENV_FOLDER }}

    - name: Terraform Plan
      run: terraform plan
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}