name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP
      - name: Set up GCP credentials
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}

      # 3️⃣ Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      # 4️⃣ Determine environment folder and workspace
      - name: Set environment variables
        id: env
        run: |
          if [ "${GITHUB_REF##*/}" == "main" ]; then
            echo "ENV_FOLDER=envs/prod" >> $GITHUB_ENV
            echo "TF_WORKSPACE=prod" >> $GITHUB_ENV
          elif [ "${GITHUB_REF##*/}" == "develop" ]; then
            echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
            echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
          else
            echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
            echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
          fi
          echo "Using environment folder: $ENV_FOLDER"
          echo "Terraform workspace: $TF_WORKSPACE"

      # 5️⃣ Switch to the correct environment folder
      - name: Change working directory to environment
        run: cd ${{ env.ENV_FOLDER }}

      # 6️⃣ Select or create Terraform workspace
      - name: Select Terraform workspace
        run: |
          terraform workspace select $TF_WORKSPACE || terraform workspace new $TF_WORKSPACE

      # 7️⃣ Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 8️⃣ Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 9️⃣ Terraform Apply (only for prod/main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
