name: 'Terraform CI'

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.7.0

    - name: Set environment variables
      id: env
      run: |
        # Use GITHUB_REF_NAME for simpler branch matching
        if [ "${{ github.ref_name }}" == "main" ]; then
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=prod" >> $GITHUB_ENV
        elif [ "${{ github.ref_name }}" == "dev" ]; then
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
        else
          # Fallback for PRs or other branches
          echo "ENV_FOLDER=envs/dev" >> $GITHUB_ENV
          echo "TF_WORKSPACE=dev" >> $GITHUB_ENV
        fi

    - name: Terraform Init
      run: |
        terraform init \
            -backend-config="bucket=ibs-dev-483509-tf-states" \
            -backend-config="prefix=${{ env.TF_WORKSPACE }}"
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    - name: Terraform Format
      run: terraform fmt -check
      working-directory: ${{ env.ENV_FOLDER }}

    - name: Terraform Plan
      run: terraform plan
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    - name: Terraform Apply
          # This condition now allows both main and dev branches to trigger an apply
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
      run: |
        terraform apply -auto-approve -var-file="terraform.tfvars"
      working-directory: ${{ env.ENV_FOLDER }}
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}